      <style>

        #s04-tok { position: absolute; z-index: 4; left: 0; top: 0; width: 300px; height: 70px; border-radius: 35px; background: var(--paper2); border: 3px solid var(--terra); box-shadow: 0 18px 30px -14px rgba(31,58,46,.55); display: flex; align-items: center; justify-content: center; font-family: "Source Sans 3", sans-serif; font-weight: 700; font-size: 42px; color: var(--forest); white-space: nowrap; }

        #s04-chip1 { left: 90px; } #s04-chip2 { left: 276px; } #s04-chip3 { left: 482px; }
        #s04-st-mute { left: 395px; top: 1034px; font-size: 38px; padding: 4px 22px; }
        #s04-st-ban { left: 725px; top: 1034px; font-size: 42px; padding: 4px 22px; }
        #s04-log { position: absolute; left: 70px; top: 1410px; width: 940px; height: 84px; border-radius: 20px; background: var(--paper2); border: 3px solid var(--rule); box-shadow: 0 20px 34px -18px rgba(31,58,46,.5); display: flex; align-items: center; gap: 22px; padding: 0 30px; font-family: "Source Sans 3", sans-serif; font-weight: 700; font-size: 42px; color: var(--forest); white-space: nowrap; }
        #s04-log em { font-style: normal; color: var(--terra); }
      </style>
      <div id="root" data-composition-id="s04" data-width="1080" data-height="1920">

        <!-- Estação 1 -->
        <svg id="s04-m1" class="s04-med" style="left:130px;top:300px" viewBox="-100 -100 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">

        <div id="s04-t1" class="s04-ttl s04-l" style="top:320px">Lê o chat</div>
        <div id="s04-c1" class="s04-cap s04-l" style="top:396px">As mensagens chegam aqui</div>

        <!-- Estação 2 -->
        <svg id="s04-m2" class="s04-med" style="left:750px;top:600px" viewBox="-100 -100 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle id="s04-r2" r="92" fill="none" stroke="#D2B568" stroke-width="4" opacity="0" />
          <circle r="90" fill="#E3E8D6" stroke="#D2B568" stroke-width="4" />
          <rect x="-52" y="-52" width="82" height="104" rx="10" fill="#FBF6EA" stroke="#1F3A2E" stroke-width="5" />
          <path d="M-36 -30 H14 M-36 -10 H14 M-36 10 H0 M-36 30 H8" stroke="#1F3A2E" stroke-width="5" />
          <circle cx="22" cy="14" r="26" fill="#FBF6EA" fill-opacity=".85" stroke="#A8461F" stroke-width="6" />

        <div id="s04-t2" class="s04-ttl s04-r" style="top:620px">Compara com a lista</div>
        <div id="s04-c2" class="s04-cap s04-r" style="top:696px">Números viram letras</div>
        <div id="s04-chip1" class="s04-chip">spam</div>
        <div id="s04-chip2" class="s04-chip">chat*</div>
        <div id="s04-chip3" class="s04-chip">passa zap</div>

        <!-- Estação 3 -->
        <svg id="s04-m3" class="s04-med" style="left:130px;top:900px" viewBox="-100 -100 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle id="s04-r3" r="92" fill="none" stroke="#D2B568" stroke-width="4" opacity="0" />
          <circle r="90" fill="#E3E8D6" stroke="#D2B568" stroke-width="4" />
          <path d="M0 -58 L46 -40 V6 C46 34 24 52 0 62 C-24 52 -46 34 -46 6 V-40z" fill="#FBF6EA" stroke="#1F3A2E" stroke-width="5" />
          <path d="M0 -58 V62" stroke="#1F3A2E" stroke-width="4" />
          <path d="M-46 -40 L0 -58 V62 C-24 52 -46 34 -46 6z" fill="#D2B568" fill-opacity=".55" stroke="none" />
          <path d="M16 -14 L32 4 M32 -14 L16 4" stroke="#A8461F" stroke-width="6" />
        </svg>
        <div id="s04-n3" class="s04-num" style="left:112px;top:904px">3</div>
        <div id="s04-t3" class="s04-ttl s04-l" style="top:905px">Silencia ou bane</div>
        <div id="s04-c3" class="s04-cap s04-l" style="top:975px">Banir vence silenciar</div>
        <div id="s04-st-mute" class="stamp mute">silenciado</div>
        <div id="s04-st-ban" class="stamp ban">banido</div>

        <!-- Estação 4 -->
        <svg id="s04-m4" class="s04-med" style="left:750px;top:1200px" viewBox="-100 -100 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle id="s04-r4" r="92" fill="none" stroke="#D2B568" stroke-width="4" opacity="0" />
          <circle r="90" fill="#E3E8D6" stroke="#D2B568" stroke-width="4" />
          <path d="M0 -40 C-20 -52 -44 -52 -60 -44 V44 C-44 36 -20 36 0 48z" fill="#FBF6EA" stroke="#1F3A2E" stroke-width="5" />
          <path d="M0 -40 C20 -52 44 -52 60 -44 V44 C44 36 20 36 0 48z" fill="#FBF6EA" stroke="#1F3A2E" stroke-width="5" />
          <path d="M-44 -22 C-30 -26 -18 -24 -12 -20 M-44 -4 C-30 -8 -18 -6 -12 -2 M-44 14 C-30 10 -18 12 -12 16 M12 -20 C20 -24 32 -26 44 -22 M12 -2 C20 -6 32 -8 44 -4" stroke="#9A7B2F" stroke-width="4" />
          <path d="M16 -64 V-40" stroke="#A8461F" stroke-width="7" />
        </svg>
        <div id="s04-n4" class="s04-num" style="left:832px;top:1204px">4</div>
        <div id="s04-t4" class="s04-ttl s04-r" style="top:1230px">Registra as ações</div>
        <div id="s04-c4" class="s04-cap s04-r" style="top:1306px">Fica no histórico</div>
        <div id="s04-log"><span class="dot"></span><span>Baniu <em>bot77</em> · palavra “spam”</span></div>

        <div id="s04-tok"><span>sp</span><span class="sw"><b id="s04-t4c">4</b><b id="s04-ta">a</b></span><span>m aqui</span></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const P = [$("#s04-p1"), $("#s04-p2"), $("#s04-p3")];
        const LEN = P.map((p) => p.getTotalLength());
        const DOCK = 160;
        const at = (i, s) => { const q = P[i].getPointAtLength(s); return { x: q.x - 150, y: q.y - 35 }; };

        // caminho e folhas
        HF.draw(tl, "#s04-p1", 0.5, 1.2); HF.draw(tl, "#s04-p2", 1.4, 1.2); HF.draw(tl, "#s04-p3", 2.3, 1.2);
        ["#s04-lf1", "#s04-lf2", "#s04-lf3"].forEach((s, i) =>
          tl.fromTo(s, { opacity: 0, scale: 0.3, transformOrigin: "50% 100%" }, { opacity: 0.85, scale: 1, duration: 0.8, ease: "back.out(1.4)" }, 1.2 + i * 0.9));
        HF.rise(tl, "#s04-kick", 0.3, { y: 24, d: 0.8 });

        const stationIn = (n, t, side) => {
          tl.fromTo("#s04-m" + n, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.3)" }, t);
          tl.fromTo("#s04-n" + n, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t + 0.4);
          tl.fromTo("#s04-r" + n, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 1.0, ease: "power2.out", transformOrigin: "50% 50%" }, t + 0.5);
          HF.rise(tl, "#s04-t" + n, t + 0.2, { y: 30, d: 0.8 });
          HF.rise(tl, "#s04-c" + n, t + 0.55, { y: 24, d: 0.8 });
        };
        // medalhões ocultos até chegarem (fromTo cuida do estado inicial)
        stationIn(1, 3.3); stationIn(2, 4.6); stationIn(3, 7.5); stationIn(4, 10.5);

        // token
        const tok = { u: 0 };
        const place = (i, s) => { const p = at(i, s); gsap.set("#s04-tok", { x: p.x, y: p.y }); };
        gsap.set("#s04-tok", { x: at(0, DOCK).x, y: at(0, DOCK).y });
        tl.fromTo("#s04-tok", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, 3.6);
        // A: estação 1 -> 2
        tl.fromTo(tok, { u: 0 }, { u: 1, duration: 1.1, ease: "power2.inOut", immediateRender: false, onUpdate() { place(0, DOCK + (LEN[0] - 2 * DOCK) * tok.u); } }, 4.5);
        // normalização sp4m -> spam
        tl.to("#s04-t4c", { opacity: 0, y: -26, rotation: -40, duration: 0.5, ease: "power2.in" }, 6.0);
        tl.fromTo("#s04-ta", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" }, 6.25);
        const chips = ["#s04-chip1", "#s04-chip2", "#s04-chip3"];
        chips.forEach((c, i) => tl.fromTo(c, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.2 + i * 0.25));
        tl.to("#s04-chip1", { backgroundColor: "#D2B568", scale: 1.1, duration: 0.5, ease: "back.out(2)", transformOrigin: "50% 50%" }, 6.85);
        tl.to("#s04-chip1", { scale: 1, duration: 0.5, ease: "power2.out" }, 7.4);
        // B: estação 2 -> 3 (token continua pelo caminho)
        const tok2 = { u: 0 };
        tl.fromTo(tok2, { u: 0 }, { u: 1, duration: 1.2, ease: "power2.inOut", immediateRender: false, onUpdate() {
          const s0 = LEN[0] - DOCK, tot = DOCK + LEN[1] - DOCK, s = tot * tok2.u;
          if (s < DOCK) place(0, s0 + s); else place(1, s - DOCK + DOCK * 0 );
        } }, 7.2);
        // carimbos
        tl.fromTo("#s04-st-mute", { opacity: 0, scale: 1.8, rotation: -8 }, { opacity: 0.45, scale: 1, duration: 0.45, ease: "power3.in", transformOrigin: "50% 50%" }, 8.6);
        tl.fromTo("#s04-st-ban", { opacity: 0, scale: 1.9 }, { opacity: 0.95, scale: 1, duration: 0.45, ease: "power3.in", transformOrigin: "50% 50%" }, 9.6);
        tl.to("#s04-st-ban", { x: 6, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, 10.05);
        tl.to("#s04-st-ban", { x: 0, duration: 0.05 }, 10.3);
        tl.to("#s04-st-mute", { opacity: 0.2, duration: 0.5 }, 10.1);
        // C: estação 3 -> 4
        const tok3 = { u: 0 };
        tl.fromTo(tok3, { u: 0 }, { u: 1, duration: 1.2, ease: "power2.inOut", immediateRender: false, onUpdate() {
          const tot = LEN[2], s = tot * tok3.u;
          if (s < DOCK) place(1, LEN[1] - DOCK + s); else place(2, s - DOCK); } }, 10.9);
        // (token já estava no fim do trecho 2; salto contínuo abaixo)
        tl.to("#s04-tok", { opacity: 0, scale: 0.5, duration: 0.6, ease: "power2.in", transformOrigin: "50% 50%" }, 12.2);
        // log
        tl.fromTo("#s04-log", { opacity: 0, y: 40, clipPath: "inset(0 100% 0 0 round 20px)" }, { opacity: 1, y: 0, clipPath: "inset(0 0% 0 0 round 20px)", duration: 1.0, ease: "power3.out" }, 12.0);
        tl.fromTo("#s04-log .dot", { scale: 0.5 }, { scale: 1.25, duration: 0.5, ease: "back.out(2)", yoyo: true, repeat: 1 }, 12.5);
        window.__timelines["s04"] = tl;
      </script>
