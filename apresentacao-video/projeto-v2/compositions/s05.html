      <script>
        const tl = gsap.timeline({ paused: true });
        const S = 1.1;
        // ponto da tela do app (x,y) -> página, dado o zoom
        const P = (x, y, z, ox, oy) => [-6.4 + (ox + (x - ox) * z) * S, 267.7 + (oy + (y - oy) * z) * S];
        function leader(id, labY, tx, ty, t, fadeAt) {
          const x0 = 650, y0 = labY + 88;
          const dx = tx - x0, dy = ty - y0, len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
          gsap.set(id, { left: x0, top: y0, width: len, rotation: ang, transformOrigin: "0% 50%" });
          tl.fromTo(id, { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, t);
          tl.to(id, { opacity: 0, duration: 0.4 }, fadeAt);
        }
        // ornamento
        HF.draw(tl, "#s05-v1", 0.2, 3.2); HF.draw(tl, "#s05-v2", 0.5, 3.2);
        tl.fromTo(["#s05-l1", "#s05-l2", "#s05-l3", "#s05-l4"], { opacity: 0, scale: 0.4, transformOrigin: "50% 100%" }, { opacity: 0.7, scale: 1, duration: 0.9, ease: "back.out(1.4)", stagger: 0.25 }, 1.8);
        tl.to(["#s05-l1", "#s05-l3"], { rotation: 4, duration: 6, ease: "sine.inOut", transformOrigin: "50% 100%", yoyo: true, repeat: 1 }, 3);
        // celular: entrada e leve inclinação 3D
        tl.fromTo("#s05-phone", { opacity: 0, y: 120, scale: S, rotationY: -12, rotationX: 3 }, { opacity: 1, y: 0, scale: S, rotationY: -6, rotationX: 2, duration: 1.3, ease: "power3.out" }, 0.1);
        tl.to("#s05-phone", { rotationY: -3, rotationX: 0, duration: 11, ease: "sine.inOut" }, 1.5);
        tl.to("#s05-phone", { y: 60, opacity: 0, duration: 0.7, ease: "power2.in" }, 12.6);
        // título
        HF.rise(tl, "#s05-kick", 0.9, { y: 30, d: 0.8 });
        HF.rise(tl, "#s05-title", 1.1, { y: 50, d: 1.0 });
        tl.to(["#s05-kick", "#s05-title"], { opacity: 0, duration: 0.5 }, 3.1);
        // cabeçalho: Robô online
        tl.fromTo("#s05-r0", { opacity: 0, scale: 1.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, 1.5);
        tl.to("#s05-r0", { opacity: 0, duration: 0.5 }, 2.9);
        // I: status da live (zoom no card)
        tl.fromTo("#s05-zoom", { scale: 1, transformOrigin: "284px 560px" }, { scale: 1.1, duration: 1.2, ease: "power2.inOut" }, 2.9);
        tl.fromTo("#s05-r1", { opacity: 0, scale: 1.05, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 3.3);
        tl.fromTo("#s05-lab1", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 3.2);
        { const [tx, ty] = P(544, 560, 1.1, 284, 560); leader("#s05-ld1", 290, tx, ty, 3.6, 4.9); }
        tl.to("#s05-r1", { opacity: 0, duration: 0.5 }, 4.9);
        tl.to("#s05-lab1", { opacity: 0.55, duration: 0.5 }, 5.0);
        // II: ações realizadas
        tl.set("#s05-zoom", { transformOrigin: "284px 560px" }, 4.4);
        tl.to("#s05-zoom", { scale: 1.1, transformOrigin: "284px 950px", duration: 1.2, ease: "power2.inOut" }, 4.4);
        tl.fromTo("#s05-r2", { opacity: 0, scale: 1.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, 5.2);
        tl.fromTo("#s05-lab2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 5.1);
        { const [tx, ty] = P(172, 950, 1.1, 284, 950); leader("#s05-ld2", 590, tx, ty, 5.5, 7.3); }
        tl.to("#s05-r2", { opacity: 0, duration: 0.4 }, 7.3);
        tl.to("#s05-lab2", { opacity: 0.55, duration: 0.5 }, 7.5);
        // III: regras ativas
        tl.fromTo("#s05-r3", { opacity: 0, scale: 1.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, 7.5);
        tl.fromTo("#s05-lab3", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 7.6);
        { const [tx, ty] = P(322, 950, 1.1, 284, 950); leader("#s05-ld3", 890, tx, ty, 7.9, 8.2); }
        tl.to("#s05-r3", { opacity: 0, duration: 0.3 }, 8.2);
        tl.to("#s05-lab3", { opacity: 0.55, duration: 0.5 }, 10.2);
        // câmera acompanha a rolagem da gravação
        tl.to("#s05-zoom", { scale: 1.0, transformOrigin: "284px 700px", duration: 1.0, ease: "power2.inOut" }, 7.6);
        tl.to("#s05-zoom", { scale: 1.05, transformOrigin: "284px 820px", duration: 1.0, ease: "power2.inOut" }, 10.0);
        // IV: fila de mensagens
        tl.fromTo("#s05-r4", { opacity: 0, scale: 1.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, 10.9);
        tl.fromTo("#s05-r5", { opacity: 0, scale: 1.15, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, 11.2);
        tl.fromTo("#s05-lab4", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 10.8);
        { const [tx, ty] = P(340, 1089, 1.05, 284, 820); leader("#s05-ld4", 1190, tx, ty, 11.2, 12.4); }
        tl.to(["#s05-r4", "#s05-r5"], { opacity: 0, duration: 0.4 }, 12.5);
        // saída: tudo cede lugar ao resumo
        tl.to(["#s05-lab1", "#s05-lab2", "#s05-lab3", "#s05-lab4"], { opacity: 0, x: 30, duration: 0.5, ease: "power2.in" }, 12.5);
        tl.to("#s05-ld4", { opacity: 0, duration: 0.3 }, 12.4);
        tl.fromTo("#s05-recap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 13.0);
        ["#s05-rr1", "#s05-rr2", "#s05-rr3", "#s05-rr4"].forEach((s, i) => tl.fromTo(s, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 13.3 + i * 0.25));
        // nota
        tl.to("#s05-demo", { opacity: 1, duration: 0.8 }, 4.0);
        tl.to("#s05-demo", { opacity: 0, duration: 0.4 }, 12.5);
        tl.fromTo("#s05-demo2", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 14.0);
