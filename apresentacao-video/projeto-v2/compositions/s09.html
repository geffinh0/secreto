    <template>
      <style>
@font-face { font-family: 'Fraunces'; src: url('assets/Fraunces72ptSoft-SemiBold.ttf'); font-weight: 600; } @font-face { font-family: 'Fraunces'; src: url('assets/Fraunces72ptSoft-Bold.ttf'); font-weight: 700; } @font-face { font-family: 'Source Sans 3'; src: url('assets/SourceSans3VF-Upright.ttf'); font-weight: 200 900; }

        #root { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
        #s09-kick { top: 252px; }
        #s09-ringwrap { position:absolute; left:340px; top:330px; width:400px; height:400px; }
        #s09-ringwrap svg { position:absolute; left:0; top:0; }
        .s09-lab { position:absolute; left:0; top:0; width:400px; height:400px; display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:112px; color:var(--forest); opacity:0; }
        #s09-min { position:absolute; top:236px; left:0; width:1080px; display:flex; justify-content:center; }
        #s09-minpill { position:relative; height:70px; font-size:44px; }
        .s09-b { position:absolute; top:0; left:70px; width:560px; box-sizing:border-box; padding:20px 28px 20px 96px; border-radius:30px; background:var(--paper2); border:3px solid var(--rule); box-shadow:0 24px 40px -22px rgba(31,58,46,.5); font-family:"Source Sans 3",sans-serif; font-weight:600; font-size:44px; line-height:1.18; color:var(--forest); opacity:0; }
        .s09-b .n { position:absolute; left:22px; top:50%; margin-top:-24px; width:48px; height:48px; border-radius:24px; background:var(--forest); color:var(--paper2); font-size:38px; font-weight:700; display:flex; align-items:center; justify-content:center; }
        .s09-b .who { display:block; font-size:38px; font-weight:700; color:var(--terra); margin-bottom:4px; }
        #s09-phone { left:668px; top:770px; transform-origin:0 0; }
        #s09-live { top:1450px; left:70px; }
        #s09-rep { position:absolute; left:340px; top:1450px; }
      </style>
      <div id="root" data-composition-id="s09" data-width="1080" data-height="1920">
        <svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" stroke="#D2B568" stroke-width="3" stroke-linecap="round">
          <path id="s09-v1" d="M-20 1500 C 60 1300, 20 1100, 40 900 S 30 520, 60 300" opacity=".6"/>
          <path id="s09-v2" d="M1100 700 C 1030 560, 1060 420, 1030 300" opacity=".6"/>
          <path id="s09-l1" d="M40 900 c-30 -8 -46 -30 -42 -58 c30 6 46 28 42 58z" fill="#D2B568" stroke="none" opacity=".8"/>
        </svg>
        <div id="s09-kick" class="center kicker">Mensagens automáticas</div>
        <div id="s09-ringwrap">
          <svg width="400" height="400" viewBox="0 0 400 400" fill="none">
            <circle cx="200" cy="200" r="168" stroke="#E3E8D6" stroke-width="30"/>
            <circle cx="200" cy="200" r="168" stroke="#CFC3A8" stroke-width="3"/>
            <circle id="s09-arc" cx="200" cy="200" r="168" stroke="#D2B568" stroke-width="30" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 200 200)"/>
            <circle cx="200" cy="200" r="132" fill="#FBF6EA" stroke="#CFC3A8" stroke-width="3"/>
          </svg>
          <div class="s09-lab" id="s09-l120">2 min</div>
          <div class="s09-lab" id="s09-l30">30 s</div>
          <div class="s09-lab" id="s09-l60">1 min</div>
          <div class="s09-lab" id="s09-l300">5 min</div>
        </div>
        <svg id="s09-rep2" class="abs" style="left:310px;top:300px" width="460" height="460" viewBox="0 0 460 460" fill="none" stroke="#A8461F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path id="s09-rarc" d="M52.5 332.5 A205 205 0 1 1 387 361.8"/>
          <path id="s09-rhead" d="M418.8 352 L387 361.8 L391 329"/>
        </svg>
        <div id="s09-min"><div id="s09-minpill" class="pill gold" style="position:relative;opacity:0">mínimo de 10 segundos</div></div>
        <div id="s09-bubbles"></div>
        <div id="s09-phone" class="phone">
          <div class="screen"><video id="s09-vid" class="clip" src="assets/clips/k06.mp4" data-start="0" data-duration="17.9" data-media-start="2.2" muted playsinline></video></div>
        </div>
        <div id="s09-live" class="pill forest" style="opacity:0"><span class="dot green"></span>enquanto a live estiver no ar</div>
      </div>
      <script>
        const MSG = ["Obrigada por acompanharem a live.","Sigam o perfil para não perder as próximas lives.","Respeito em primeiro lugar no chat.","Bem-vindos! Fiquem à vontade."];
        const SLOTS = [785, 1005, 1225];
        const TICKS = [3.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.0];
        const host = document.getElementById("s09-bubbles");
        const heights = [];
        TICKS.forEach((t,i)=>{
          const d = document.createElement("div"); d.className="s09-b"; d.id="s09-b"+i;
          d.innerHTML = '<span class="n">'+((i%4)+1)+'</span>'+MSG[i%4];
          host.appendChild(d);
        });
        const tl = gsap.timeline({ paused: true });
        HF.draw(tl, "#s09-v1", 0.2, 2.2); HF.draw(tl, "#s09-v2", 0.5, 2.0);
        tl.fromTo("#s09-l1", {opacity:0,scale:.4,transformOrigin:"50% 100%"},{opacity:.8,scale:1,duration:.8,ease:"back.out(1.4)"},2.0);
        HF.rise(tl, "#s09-kick", 0.3, {y:30,d:0.8});
        tl.fromTo("#s09-ringwrap",{opacity:0,scale:.8,transformOrigin:"50% 50%"},{opacity:1,scale:1,duration:.9,ease:"back.out(1.2)"},0.6);
        tl.fromTo("#s09-l120",{opacity:0},{opacity:1,duration:.5},1.0);
        // ring sweeps + labels
        const sweepEnds = TICKS;
        sweepEnds.forEach((te,i)=>{
          const s = te-1.8;
          tl.fromTo("#s09-arc",{strokeDashoffset:100},{strokeDashoffset:0,duration:1.8,ease:"sine.inOut"},Math.max(s,1.2));
          tl.set("#s09-arc",{strokeDashoffset:100},te+0.15);
        });
        const lab = (from,to,t)=>{ tl.to(from,{opacity:0,duration:.3},t); tl.fromTo(to,{opacity:0,scale:.8,transformOrigin:"50% 50%"},{opacity:1,scale:1,duration:.5,ease:"back.out(1.4)"},t+.2); };
        lab("#s09-l120","#s09-l30",4.4);
        lab("#s09-l30","#s09-l60",6.6);
        lab("#s09-l60","#s09-l300",8.8);
        lab("#s09-l300","#s09-l120",12.0);
        tl.to("#s09-kick",{opacity:0,duration:.4},6.6);
        tl.fromTo("#s09-minpill",{opacity:0,y:20},{opacity:1,y:0,duration:.7,ease:"power3.out"},6.9);
        tl.to("#s09-minpill",{opacity:0,duration:.4},9.8);
        tl.to("#s09-kick",{opacity:1,duration:.5},10.2);
        // bubbles carousel
        TICKS.forEach((t,i)=>{
          const id="#s09-b"+i;
          tl.fromTo(id,{opacity:0,y:SLOTS[2]+120,scale:.92,transformOrigin:"0 50%"},{opacity:1,y:SLOTS[2],scale:1,duration:.8,ease:"back.out(1.2)"},t-0.3);
        });
        // bubbles are absolute with top via y: set top 0
        TICKS.forEach((t,i)=>{
          // later ticks shift this bubble up
          const id="#s09-b"+i;
          if (i+1<TICKS.length) tl.to(id,{y:SLOTS[1],duration:.9,ease:"power3.inOut"},TICKS[i+1]-0.3);
          if (i+2<TICKS.length) tl.to(id,{y:SLOTS[0],duration:.9,ease:"power3.inOut"},TICKS[i+2]-0.3);
          if (i+3<TICKS.length) tl.to(id,{y:SLOTS[0]-120,opacity:0,duration:.8,ease:"power2.in"},TICKS[i+3]-0.3);
        });
        // phone
        tl.fromTo("#s09-phone",{opacity:0,y:180,scale:.58,transformOrigin:"0 0"},{opacity:1,y:0,scale:.58,duration:1.1,ease:"power3.out"},1.6);
        tl.to("#s09-phone",{y:-12,duration:3.4,ease:"sine.inOut",yoyo:true,repeat:1},3.0);
        // repetition arrow
        HF.draw(tl,"#s09-rarc",11.0,1.4);
        tl.fromTo("#s09-rhead",{opacity:0},{opacity:1,duration:.3},12.3);
        tl.fromTo("#s09-live",{opacity:0,y:30},{opacity:1,y:0,duration:.8,ease:"power3.out"},13.6);
        tl.to("#s09-live",{scale:1.03,duration:1.1,ease:"sine.inOut",yoyo:true,repeat:1,transformOrigin:"0 50%"},14.6);
        window.__timelines["s09"] = tl;
      </script>
    </template>
