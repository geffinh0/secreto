<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Atila's Client — Painel de Controle e Moderação Automática para SuperLive">
  <meta name="theme-color" content="#F4ECDC">
  <script>
    // Same mood as the app, before the first paint: the saved choice
    // (Flutter's shared_preferences key "flutter.theme_mode": light | dark |
    // system) or, without one, the device setting.
    (function () {
      var mode = 'system';
      try {
        var raw = window.localStorage.getItem('flutter.theme_mode');
        if (raw) { try { raw = JSON.parse(raw); } catch (e) {} mode = String(raw); }
      } catch (e) {}
      var dark = mode === 'dark' ||
        (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#121C17');
      }
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Atila's Client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Atila's Client</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; }
    body {
      background-color: #F4ECDC;
      margin: 0;
      color: #1F3A2E;
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    /* Same layout as AppSplash (lib/widgets/common/app_splash.dart): the fox
       from behind, a ring and one line, centred - so the hand-off from this
       page to Flutter is invisible. */
    .loading-container {
      box-sizing: border-box;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.24s ease;
    }
    .fox { height: 132px; width: auto; display: block; }
    .ring {
      width: 28px;
      height: 28px;
      margin-top: 24px;
      box-sizing: border-box;
      border: 2.5px solid #E3E8D6;
      border-top-color: #A8461F;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #121C17; color: #F1E9D8; }
    html[data-theme="dark"] .ring { border-color: #263A2F; border-top-color: #B04B21; }
    html[data-theme="dark"] .loading-sub { color: #B9C4B4; }
    .loading-sub { font-size: 14px; line-height: 1.45; color: #4A5B4F; margin: 16px 0 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; border-top-color: #A8461F; } }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator" role="status" aria-label="Carregando">
    <img class="fox" src="assets/assets/fox/fox_back.webp" alt="">
    <div class="ring"></div>
    <p class="loading-sub">Abrindo o painel</p>
  </div>

  <script>
    // Chrome/Edge/Android fire this instead of showing their own install UI
    // when the page is installable; stash it so a button in Settings can
    // trigger the native prompt on demand. iOS has no such event - Safari
    // only offers "Adicionar à Tela de Início" from its own Share sheet, so
    // that case is just static instructions on the Dart side (pwaIsIos()).
    window.__pwaInstallEvent = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__pwaInstallEvent = e;
    });
    window.addEventListener('appinstalled', function() {
      window.__pwaInstallEvent = null;
    });
    window.pwaCanPromptInstall = function() {
      return window.__pwaInstallEvent !== null;
    };
    window.pwaTriggerInstall = function() {
      var evt = window.__pwaInstallEvent;
      if (!evt) return;
      window.__pwaInstallEvent = null;
      evt.prompt();
    };
    window.pwaIsStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
    };
    window.pwaIsIos = function() {
      return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    };

    window.addEventListener('flutter-first-frame', function() {
      var loadingIndicator = document.getElementById('loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.style.opacity = '0';
        setTimeout(function() {
          loadingIndicator.remove();
        }, 240);
      }
    });
  </script>
  <script>
    // ---- Update scheme (see DEPLOY.md, "Atualização para todos") ----------------
    // The deploy replaces the @@BUILD_ID@@ token below with a value unique to that deploy
    // (git sha + timestamp). It is used to (1) put a version on the URLs of the
    // app files, (2) clear whatever an older version left in this browser exactly
    // once, and (3) notice, while the app stays open, that a newer one exists.
    (function () {
      var BUILD = '@@BUILD_ID@@';
      var DEV = BUILD.indexOf('@@') === 0; // not stamped: local `flutter run`
      window.__BUILD_ID__ = DEV ? '' : BUILD;
      window.__updateAvailable = false;

      function purge() {
        // Service worker + Cache Storage only. localStorage (login) is left alone.
        var work = [];
        if ('serviceWorker' in navigator) {
          work.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          work.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        return Promise.all(work);
      }

      function hasLeftovers() {
        var checks = [];
        if ('serviceWorker' in navigator) {
          checks.push(navigator.serviceWorker.getRegistrations().then(function (r) { return r.length > 0; }));
        }
        if (window.caches) {
          checks.push(caches.keys().then(function (k) { return k.length > 0; }));
        }
        return Promise.all(checks).then(function (r) { return r.indexOf(true) !== -1; });
      }

      function startApp() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js' + (DEV ? '' : '?v=' + encodeURIComponent(BUILD));
        s.async = true;
        document.body.appendChild(s);
      }

      // The nginx sends `Clear-Site-Data: "cache"` until this cookie matches the
      // current build, so the HTTP cache of an old visit is dropped one time.
      if (!DEV) {
        try {
          document.cookie = 'app_build=' + BUILD + '; path=/; max-age=31536000; SameSite=Lax' +
              (location.protocol === 'https:' ? '; Secure' : '');
        } catch (e) {}
      }

      // Stored build differs (or never stored: a visitor from before this scheme):
      // drop the old service worker and caches, then reload once into the new files.
      function guard() {
        if (DEV) return Promise.resolve(false);
        var stored = null, tried = null;
        try {
          stored = localStorage.getItem('app_build');
          tried = sessionStorage.getItem('app_purge');
          localStorage.setItem('app_build', BUILD);
        } catch (e) { return Promise.resolve(false); }
        if (stored === BUILD || tried === BUILD) return Promise.resolve(false);
        return hasLeftovers().then(function (left) {
          if (!left) return false;
          try { sessionStorage.setItem('app_purge', BUILD); } catch (e) {}
          return purge().then(function () { return true; });
        });
      }

      guard().then(function (reloading) {
        if (reloading) { location.reload(); return; }
        startApp();
      }, startApp);

      // While the app is open: ask the server which build is live.
      function check() {
        if (DEV) return;
        fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (j && typeof j.build === 'string' && j.build && j.build !== BUILD) {
              window.__updateAvailable = true;
            }
          })
          .catch(function () {});
      }
      setInterval(check, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
      window.appUpdateAvailable = function () { return window.__updateAvailable === true; };
      window.appApplyUpdate = function () {
        purge().then(function () { location.reload(); }, function () { location.reload(); });
      };
    })();
  </script>
</body>
</html>
