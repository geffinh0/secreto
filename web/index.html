<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Atila's Client — Painel de Controle e Moderação Automática para SuperLive">
  <meta name="theme-color" content="#E07B39">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Atila's Client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Atila's Client</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #1B140F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #F7EEE3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: opacity 0.4s ease;
    }
    .logo-frame {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: #241B15;
      border: 1px solid #3A2D22;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      animation: gentle-pulse 2.4s ease-in-out infinite;
    }
    .logo-frame img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .loading-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #F7EEE3;
    }
    .loading-sub {
      font-size: 12px;
      color: #8C7968;
      letter-spacing: 0.3px;
    }
    .spinner-bar {
      width: 140px;
      height: 3px;
      background: #2C2119;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .spinner-bar::after {
      content: '';
      position: absolute;
      left: -50%;
      height: 100%;
      width: 50%;
      background: #E07B39;
      border-radius: 3px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes indeterminate {
      0% { left: -50%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="logo-frame">
      <img src="favicon.png" alt="Atila's Client">
    </div>
    <div style="text-align: center;">
      <div class="loading-title">Atila's Client</div>
      <div class="loading-sub">Iniciando sistema...</div>
    </div>
    <div class="spinner-bar"></div>
  </div>

  <script>
    // Chrome/Edge/Android fire this instead of showing their own install UI
    // when the page is installable; stash it so a button in Settings can
    // trigger the native prompt on demand. iOS has no such event - Safari
    // only offers "Adicionar à Tela de Início" from its own Share sheet, so
    // that case is just static instructions on the Dart side (pwaIsIos()).
    window.__pwaInstallEvent = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__pwaInstallEvent = e;
    });
    window.addEventListener('appinstalled', function() {
      window.__pwaInstallEvent = null;
    });
    window.pwaCanPromptInstall = function() {
      return window.__pwaInstallEvent !== null;
    };
    window.pwaTriggerInstall = function() {
      var evt = window.__pwaInstallEvent;
      if (!evt) return;
      window.__pwaInstallEvent = null;
      evt.prompt();
    };
    window.pwaIsStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
    };
    window.pwaIsIos = function() {
      return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    };

    window.addEventListener('flutter-first-frame', function() {
      var loadingIndicator = document.getElementById('loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.style.opacity = '0';
        setTimeout(function() {
          loadingIndicator.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
