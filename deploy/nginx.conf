server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # These must always be fetched fresh: the service worker is what detects
    # and applies updates, so a stale copy of any of these means visitors
    # never see a new deploy no matter how long they keep the tab open.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API: the Flutter build points at /api (see web.Dockerfile),
    # so the browser never needs CORS and the domain is never baked into the
    # bundle. Trailing slash on proxy_pass strips the /api/ prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=604800";
    }
}
