# This file is dropped into conf.d/, i.e. it lives inside nginx's http{} block,
# so http-level directives (the rate-limit zones) are valid at the top.

# Per-client-IP request limits for the endpoints worth brute-forcing or abusing.
# Sized for hundreds of creators behind a handful of agency networks: generous
# for a person, hopeless for a script. Over the limit = 429 (not nginx's 503).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=robotconn_zone:10m rate=1r/s;
limit_req_status 429;

# Update scheme (DEPLOY.md, "Atualização para todos"). @@BUILD_ID@@ is replaced by
# the web image build with this deploy's id. index.html sets the cookie `app_build`
# to that same id after it loads; until a browser has it, the HTML response carries
# `Clear-Site-Data: "cache"`, which drops what an older visit left in the HTTP cache
# (the old config cached every file for 7 days). Only "cache": never "storage",
# which would also wipe the login kept in localStorage. Browsers without support
# (Safari) skip it and still get fresh files through the ?v= URLs.
map $cookie_app_build $clear_site_data {
    "@@BUILD_ID@@" "";
    default        '"cache"';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The real client IP. This container only ever receives traffic from the
    # reverse proxy in front of it (docker network proxy_shared), which appends
    # the visitor's address to X-Forwarded-For. Trust that header ONLY from the
    # private docker ranges and take the right-most address that is not one of
    # them: without this every visitor looked like the proxy, so the rate limits
    # below and the backend's login throttle were one shared bucket for everyone.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Same-origin API forwarding (see the /api/ blocks). Declared once here so
    # every proxied location below inherits them.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nothing the app is made of may be reused without asking the server first:
    # `no-cache` means "store it, but revalidate (ETag -> 304) on every use", so a
    # new deploy reaches everybody on their next visit and unchanged files still
    # cost only a tiny 304. index.html also flushes the old HTTP cache once per build.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Clear-Site-Data $clear_site_data always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }
    # The running app polls this to learn that a newer build is live. Never cached.
    location = /build.json {
        add_header Cache-Control "no-store";
    }

    # Login / signup (portal and admin panel): the backend also throttles failed
    # logins and wrong agency codes; this stops the flood before it gets there.
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://backend:8000/auth/;
    }
    location = /api/admin/login {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://backend:8000/admin/login;
    }

    # Connecting a SuperLive account (password / SMS / e-mail code) calls
    # SuperLive through the shared egress IP and can text a third party.
    location /api/robot/connect {
        limit_req zone=robotconn_zone burst=10 nodelay;
        proxy_pass http://backend:8000/robot/connect;
    }

    # Same-origin API: the Flutter build points at /api (see web.Dockerfile),
    # so the browser never needs CORS and the domain is never baked into the
    # bundle. Trailing slash on proxy_pass strips the /api/ prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
