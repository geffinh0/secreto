# Atila's Client - bloco de servidor ADICIONAL pro nginx do cata-pobre.
#
# Isso NÃO toca em nginx/app.conf nem em nenhum outro arquivo existente:
# vai como um arquivo novo (nginx/atila.conf), que o nginx já recolhe
# sozinho por causa do `include /etc/nginx/conf.d/*.conf;` em nginx.conf.
#
# Domínio: atilaclient.tech (registrado à parte na Hostinger - não é
# subdomínio do catapobre.com.br).

server {
    listen 80;
    server_name atilaclient.tech www.atilaclient.tech;
    access_log /var/log/nginx/access.log privado;
    error_log /var/log/nginx/error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name atilaclient.tech www.atilaclient.tech;
    access_log /var/log/nginx/access.log privado;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/atilaclient.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atilaclient.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    # O container do Atila's Client (atilas_client_web) já serve o Flutter Web
    # com seu próprio cache/gzip e faz proxy de /api/ pro backend sozinho -
    # esse bloco só repassa tudo pra ele, via a rede Docker "proxy_shared".
    location / {
        proxy_pass http://atilas_client_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
