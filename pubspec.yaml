name: atilas_client
description: Atila's Client - Portal de Moderação de Lives do SuperLive
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.2

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.6

  # Navigation
  go_router: ^13.2.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  equatable: ^2.0.5

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # Web specific
  url_launcher: ^6.2.5
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/fox/

  # Local fonts (SIL OFL 1.1, licences in assets/fonts/). Fraunces only for
  # display type >= 20px; Source Sans 3 (variable) for everything else. The
  # variable file is declared once per weight so the engine never fakes bold;
  # the real weight comes from the wght variation set in AppType.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces72ptSoft-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces72ptSoft-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 700
