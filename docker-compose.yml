name: atilas-client

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    container_name: atilas_client_backend
    restart: unless-stopped
    environment:
      # Only the accounts created so far (+ whatever's imported by hand) can
      # log in; the public sign-up form is off for now. Set to "1" (or drop
      # the line - "1" is the default) to open registration back up.
      SM_ALLOW_REGISTRATION: "0"
      # SuperLive flags this VPS's own IP as a datacenter/VPN address on some
      # endpoints (e.g. the public search behind "buscar por ID"). Routing
      # through a SOCKS5 proxy that exits via a residential connection (see
      # deploy/notebook-proxy/) avoids that false positive. Empty = connect
      # directly, same as before this existed. 172.28.0.1 is this compose
      # project's own "internal" network gateway (pinned below), reached by a
      # tunnel that only this host's loopback can open (deploy/notebook-proxy/
      # systemd unit) - never exposed outside the Docker bridge.
      SUPERLIVE_PROXY_URL: "socks5h://172.28.0.1:1080"
    volumes:
      - backend_data:/data
    networks:
      - internal
    # No ports published: only the web container (on the same internal
    # network) can reach it. Never expose this directly to the internet.

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: atilas_client_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Kept for local debugging on the VPS itself (`curl localhost:8088`).
      # The real public path is through the existing reverse proxy below,
      # which reaches this container by name over `proxy_shared`, not
      # through this port.
      - "127.0.0.1:8088:80"
    networks:
      - internal
      - proxy_shared

networks:
  # Pinned subnet so the gateway IP (172.28.0.1) is predictable - that's the
  # address the SOCKS5 proxy (deploy/notebook-proxy/) binds to on the VPS
  # host, and SUPERLIVE_PROXY_URL above points at it directly.
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Pre-existing external network (created once with `docker network create
  # proxy_shared`) shared with whatever reverse proxy already runs on this
  # VPS, so it can reach this container by name (atilas_client_web) without
  # touching this project or needing a host port.
  proxy_shared:
    external: true

volumes:
  # Named volume for the SQLite DB (robot token, portal accounts, rules...).
  # Survives `docker compose down` / image rebuilds; only
  # `docker volume rm atilas-client_backend_data` would wipe it.
  backend_data:
