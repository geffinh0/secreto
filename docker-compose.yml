name: atilas-client

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    container_name: atilas_client_backend
    restart: unless-stopped
    environment:
      # Sign-up is open but gated: every new creator must type an AGENCY CODE
      # (created in the admin panel, "Agências" tab) or the request is refused.
      # Set SM_ALLOW_REGISTRATION=0 in .env to close it completely.
      SM_ALLOW_REGISTRATION: "${SM_ALLOW_REGISTRATION:-1}"
      # Wrong agency codes allowed per client IP per 10 minutes (guessing).
      SM_REGISTER_IP_MAX: "${SM_REGISTER_IP_MAX:-20}"
      # SuperLive flags this VPS's own IP as a datacenter/VPN address on some
      # endpoints (e.g. the public search behind "buscar por ID"). Routing
      # through a SOCKS5 proxy that exits via a residential connection (see
      # deploy/notebook-proxy/) avoids that false positive. Empty = connect
      # directly, same as before this existed. 172.28.0.1 is this compose
      # project's own "internal" network gateway (pinned below), reached by a
      # tunnel that only this host's loopback can open (deploy/notebook-proxy/
      # systemd unit) - never exposed outside the Docker bridge.
      SUPERLIVE_PROXY_URL: "socks5h://172.28.0.1:1080"
      # SCALE: more egress IPs = more robots. Comma-separated proxy URLs; the
      # FIRST must stay the one above (accounts connected before the pool
      # existed keep that IP). Every creator is pinned to one entry when her
      # robot first connects, balanced across the list, and each entry gets its
      # own request queue (one IP = ~2.8 requests/s and 20 chat messages/min).
      # Empty = only the single proxy above. Capacity guide: DEPLOY.md.
      SUPERLIVE_PROXY_URLS: "${SUPERLIVE_PROXY_URLS:-}"
      # Share of each egress's request budget (req/s) given to "is she live yet?"
      # polling; the more creators per IP, the slower each is polled.
      SM_POLL_BUDGET_RPS: "${SM_POLL_BUDGET_RPS:-1.5}"      # Shared secret the Telegram healthbot sends to read /robot/live_status
      # (no portal login of its own - see main.py). Comes from a .env file
      # next to this compose file, never committed; see DEPLOY.md. Empty =
      # the endpoint refuses every request, it never falls open.
      HEALTHBOT_API_KEY: "${HEALTHBOT_API_KEY:-}"
      # Which portal user's robot /robot/live_status reports on - only needed
      # once more than one user has an active watch at the same time (see
      # main.py). Empty = unchanged old behaviour for the single-user case;
      # the endpoint now refuses to guess (503) instead of leaking an
      # arbitrary user's data when this is ambiguous and unset.
      HEALTHBOT_TARGET_USER_ID: "${HEALTHBOT_TARGET_USER_ID:-}"
      # Opt-in persistent log file (see main.py) - under /data so it
      # survives a `docker compose up -d --build` recreating this
      # container mid-test, unlike `docker logs`. Empty = console-only
      # logging, same as before this existed. Set via .env when running a
      # multi-account test that needs to be reviewed afterwards; unset it
      # again once done so routine operation doesn't grow this file forever.
      SM_LOG_FILE: "${SM_LOG_FILE:-}"
      # Bootstraps the FIRST admin_accounts row at startup, only while none
      # exists yet (see main._bootstrap_admin_account) - the admin panel's
      # own login, fully separate from the portal's users table. No public
      # /admin/register exists; this .env pair is the only way in. Same
      # never-committed-secret pattern as HEALTHBOT_API_KEY above. Safe to
      # leave set permanently: once the account exists, this is a no-op.
      ADMIN_BOOTSTRAP_USERNAME: "${ADMIN_BOOTSTRAP_USERNAME:-}"
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:-}"
      # Real client IP for the login throttle. uvicorn only believes
      # X-Forwarded-For from these peers and takes the right-most address that is
      # NOT one of them. The chain is: cata-pobre nginx -> web (172.28.0.10) ->
      # backend, each appending, so list web and the shared proxy's address on
      # proxy_shared (`docker network inspect proxy_shared`, see DEPLOY.md). Never
      # "*" and never a whole subnet. If the proxy is missing here (or its IP
      # changed) everyone simply looks like the proxy again - the old behaviour,
      # never an attacker-chosen address.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.28.0.10}"
      # Failed logins allowed per client IP per 5 minutes (per username it is
      # always 8). 50 is the safe default while the real client IP may not reach
      # the backend; with FORWARDED_ALLOW_IPS listing the cata-pobre proxy (it
      # does, pinned at 172.19.0.3) 10-15 is reasonable. Set it in .env.
      SM_LOGIN_IP_MAX: "${SM_LOGIN_IP_MAX:-50}"
      # Max robots running at once across ALL creators (0 = no cap). Each egress
      # IP sustains roughly 25 live sessions (backend/superlive.py: serial queue,
      # ~2.8 req/s); raise this by 25 for every proxy added to SUPERLIVE_PROXY_URLS.
      SM_MAX_SESSIONS: "${SM_MAX_SESSIONS:-25}"
      # The robot's SuperLive token is encrypted at rest with the key in this
      # file (a Docker secret, below) - a path, not the key itself, so
      # `docker inspect` shows nothing useful. Missing/unreadable key = the robot
      # features answer 503; a token is never stored in clear.
      SM_TOKEN_KEY_FILE: /run/secrets/sm_token_key
    secrets:
      - sm_token_key
    volumes:
      - backend_data:/data
    networks:
      internal:
        # Pinned so the SOCKS5 proxy's firewall rule (DEPLOY.md section 8) can
        # name exactly this container instead of the whole subnet.
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No ports published: only the web container (on the same internal
    # network) can reach it. Never expose this directly to the internet.

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: atilas_client_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Kept for local debugging on the VPS itself (`curl localhost:8088`).
      # The real public path is through the existing reverse proxy below,
      # which reaches this container by name over `proxy_shared`, not
      # through this port.
      - "127.0.0.1:8088:80"
    networks:
      internal:
        # Pinned: this is the peer the backend trusts for X-Forwarded-For
        # (FORWARDED_ALLOW_IPS above).
        ipv4_address: 172.28.0.10
      proxy_shared:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Pinned subnet so the gateway IP (172.28.0.1) is predictable - that's the
  # address the SOCKS5 proxy (deploy/notebook-proxy/) binds to on the VPS
  # host, and SUPERLIVE_PROXY_URL above points at it directly.
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Pre-existing external network (created once with `docker network create
  # proxy_shared`) shared with whatever reverse proxy already runs on this
  # VPS, so it can reach this container by name (atilas_client_web) without
  # touching this project or needing a host port.
  proxy_shared:
    external: true

secrets:
  # Created once on the VPS by deploy/deploy.sh (never committed; ./secrets/ is
  # gitignored). Keep it OUT of the backend_data volume and out of backups of it:
  # a key stored next to the data it protects protects nothing.
  sm_token_key:
    file: ./secrets/sm_token_key

volumes:
  # Named volume for the SQLite DB (robot token, portal accounts, rules...).
  # Survives `docker compose down` / image rebuilds; only
  # `docker volume rm atilas-client_backend_data` would wipe it.
  backend_data:
